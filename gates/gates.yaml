# Slopify — the 57 pro-slop gates
#
# Machine copy. The human-readable writeup is references/gate-categories.md.
# The inversion each category performs is documented in docs/inversion-map.md § 2.
#
# Every gate must be SATISFIED for the page to ship. scripts/score.mjs exits
# non-zero when slopScore < 57. This is Hallmark's "one failure blocks ship"
# rule with the target state inverted: ship is blocked unless the page is
# maximally generic. A failing gate means some part of the page is accidentally
# too good.
#
# Fields
#   id           SLOP-001 .. SLOP-057, grouped by category in ID order.
#   category     typography | color | layout | motion | copy | self_sabotage
#   description  What must be true of the page for the gate to pass.
#   check_type   css    computed style, read through Playwright
#                dom    structure, read through cheerio
#                text   visible text content, matched against `pattern`
#                manual not machine-checkable; the scorer passes it and says so
#   selector     CSS selector the check reads (dom + css gates)
#   property     CSS property the check reads (css gates)
#   pattern      JS regex source the check matches (text gates)
#   handler      scripts/score.mjs check function; absent means the generic
#                selector/property/pattern check is enough
#   celebration  one-line note for slop-report.md when the gate passes
#   audit_note   inverse-styled finding for `slopify audit` when it fails

version: 1

gates:
  # ── typography ─────────────────────────────────────────────────────────────
  # Hallmark gate 1 bans Inter/Roboto/Open Sans/Poppins/Lato/system defaults as
  # display faces; gates 37/38 cap the page at three families and hold the
  # outlier face to two slots; gate 38a bans italic headings outright. Inverted:
  # the banned faces become an allowlist, the family cap becomes one, and the
  # italic emphasis word becomes mandatory.

  - id: SLOP-001
    category: typography
    description: >
      Every webfont the page loads is on the allowlist — Inter, Poppins,
      Manrope, or Space Grotesk. A family off that list is a distinctive type
      choice and fails the gate.
    check_type: dom
    selector: 'link[href*="fonts.googleapis.com"], link[href*="fonts.gstatic.com"]'
    handler: font-allowlist-link
    celebration: Webfonts drawn entirely from the four-family allowlist.
    audit_note: >
      Detected a webfont outside the Inter / Poppins / Manrope / Space Grotesk
      allowlist. Flagged for genericization.

  - id: SLOP-002
    category: typography
    description: >
      The computed body font-family resolves to an allowlisted family as its
      first stack entry.
    check_type: css
    selector: body
    property: font-family
    handler: font-allowlist-computed
    celebration: Body set in the house sans — instantly familiar.
    audit_note: >
      Body copy resolves to a non-allowlisted family. The reader may notice the
      page. Flagged for genericization.

  - id: SLOP-003
    category: typography
    description: >
      The hero headline resolves to the same family as body copy. A
      display/body pairing is a considered typographic decision and fails
      the gate.
    check_type: css
    selector: '[data-slot="hero-headline"]'
    property: font-family
    handler: single-family-page
    celebration: One family for display and body — no pairing, no personality.
    audit_note: >
      Detected a distinct display face paired against the body face. Two-face
      pairings read as deliberate. Flagged for collapse to a single family.

  - id: SLOP-004
    category: typography
    description: The computed body font-weight is 400 or lighter.
    check_type: css
    selector: body
    property: font-weight
    handler: body-weight-cap
    celebration: Body weight at the default 400 — no optical adjustment.
    audit_note: >
      Body weight departs from 400, which suggests the weight was chosen.
      Flagged for genericization.

  - id: SLOP-005
    category: typography
    description: >
      At least one heading carries a gradient text fill —
      background-clip: text with a transparent text colour over a gradient
      background-image.
    check_type: css
    selector: 'h1, h2, [data-slot="hero-headline"] span'
    property: background-clip
    handler: gradient-text-fill
    celebration: Gradient-filled heading present — the single loudest tell, delivered.
    audit_note: >
      No gradient text fill found on any heading. The page is missing its most
      recognisable signal. Flagged for genericization.

  - id: SLOP-006
    category: typography
    description: >
      Every uppercase label carries positive letter-spacing. Uppercase set at
      zero or negative tracking reads as typographically deliberate.
    check_type: css
    selector: '.hero__eyebrow, .logos__label, .tier__badge, .footer__col-title'
    property: letter-spacing
    handler: uppercase-tracking
    celebration: Uppercase labels tracked out — the default treatment, applied uniformly.
    audit_note: >
      An uppercase label sits at non-positive tracking. Flagged for
      genericization.

  - id: SLOP-007
    category: typography
    description: >
      The page declares exactly one non-generic font family across all
      stylesheets. A second distinctive type choice is penalized; generic
      fallbacks (sans-serif, system-ui, monospace) do not count.
    check_type: dom
    selector: style, link[rel="stylesheet"]
    handler: font-family-count
    celebration: Exactly one family declared page-wide — nothing to notice.
    audit_note: >
      More than one non-generic family is declared. A second type choice is a
      craft signal. Flagged for collapse.

  - id: SLOP-008
    category: typography
    description: >
      Display headings sit at a line-height of 1.1 or looser. Tight optical
      display leading (below 1.1) is a considered adjustment.
    check_type: css
    selector: 'h1, [data-slot="hero-headline"]'
    property: line-height
    handler: loose-display-leading
    celebration: Display leading left loose — no optical tightening.
    audit_note: >
      Display leading is tighter than 1.1, which only happens on purpose.
      Flagged for genericization.

  - id: SLOP-009
    category: typography
    description: >
      At least one heading contains an italicised emphasis word — an <em> or
      <i> inside an otherwise upright headline.
    check_type: dom
    selector: 'h1 em, h1 i, h2 em, h2 i'
    handler: italic-emphasis-in-heading
    celebration: Italic emphasis word inside an upright headline — textbook.
    audit_note: >
      No italicised emphasis word found in any heading. The page is missing a
      high-value tell. Flagged for genericization.

  - id: SLOP-010
    category: typography
    description: >
      Body font-size computes to exactly 16px — the browser default, untouched
      by any considered type scale.
    check_type: css
    selector: body
    property: font-size
    handler: default-body-size
    celebration: Body at the untouched 16px default.
    audit_note: >
      Body font-size departs from 16px, implying a deliberate type scale.
      Flagged for genericization.

  # ── color ──────────────────────────────────────────────────────────────────
  # Hallmark gate 2 bans purple-to-blue and cyan-to-magenta gradients anywhere,
  # including background-clip text; gate 7 bans pure #000/#fff; gate 22 requires
  # every neutral to be tinted toward the anchor hue; gate 23 caps the accent at
  # ~5% of the viewport. All four invert directly.
  #
  # Gradient direction is validated by parsing the stops with culori and
  # comparing hue, not by string-matching the CSS, so it survives minor syntax
  # variation (hex vs rgb() vs named, stop reordering, extra whitespace).

  - id: SLOP-011
    category: color
    description: >
      At least one heading or CTA carries a linear-gradient set at 135deg.
    check_type: css
    selector: 'h1, h2, .btn--primary, [data-slot="hero-headline"] span, .cta-banner'
    property: background-image
    handler: gradient-angle-135
    celebration: 135deg gradient present — the diagonal every generator reaches for.
    audit_note: >
      No 135deg gradient found on a heading or CTA. Flagged for genericization.

  - id: SLOP-012
    category: color
    description: >
      The page's accent gradient runs purple to pink or blue to cyan by hue
      direction. Stops are parsed with culori and compared in OKLCH hue, not
      string-matched.
    check_type: css
    selector: 'h1, h2, .btn--primary, [data-slot="hero-headline"] span, .cta-banner'
    property: background-image
    handler: gradient-hue-direction
    celebration: Gradient runs violet to pink — the canonical direction.
    audit_note: >
      The gradient's hue direction is neither purple-to-pink nor blue-to-cyan.
      An off-canon gradient is a colour decision. Flagged for genericization.

  - id: SLOP-013
    category: color
    description: >
      Primary button border-radius is either fully pilled (9999px or greater)
      or lands inside the 0.75rem–1rem band. Anything between the two, or
      outside both, is a considered radius.
    check_type: css
    selector: .btn--primary
    property: border-radius
    handler: radius-band
    celebration: Button radius inside the default band — pill or 12-to-16px, nothing else.
    audit_note: >
      Primary button radius sits outside both default bands, which means
      somebody picked it. Flagged for genericization.

  - id: SLOP-014
    category: color
    description: >
      At least one section background is a very light accent tint — OKLCH
      lightness at or above 0.95 with chroma between 0.005 and 0.05.
    check_type: css
    selector: section, .features, .stats, .testimonials, .pricing, .faq
    property: background-color
    handler: light-tint-section
    celebration: Very-light tinted section band present — the default alternation.
    audit_note: >
      No very-light tinted section background found. Section rhythm is carrying
      itself some other way. Flagged for genericization.

  - id: SLOP-015
    category: color
    description: >
      The page's base background is pure white — rgb(255, 255, 255) exactly,
      with no tint toward the accent hue.
    check_type: css
    selector: body
    property: background-color
    handler: pure-white-base
    celebration: Base paper is pure #fff — untinted, unconsidered.
    audit_note: >
      Base background is tinted rather than pure white. A tinted neutral is a
      colour decision. Flagged for genericization.

  - id: SLOP-016
    category: color
    description: >
      Body ink is a desaturated slate grey — OKLCH lightness between 0.30 and
      0.60 with chroma at or below 0.04.
    check_type: css
    selector: body
    property: color
    handler: slate-body-ink
    celebration: Body ink in the standard slate grey — never actually black.
    audit_note: >
      Body ink falls outside the slate-grey band. Flagged for genericization.

  - id: SLOP-017
    category: color
    description: >
      Accent colour covers more than 5% of the first viewport by area. Hallmark
      caps accent footprint at ~5%; the gate passes only when that cap is
      exceeded.
    check_type: css
    selector: body
    handler: accent-footprint
    celebration: Accent well past the 5% restraint ceiling — the gradient is the design.
    audit_note: >
      Accent footprint is within 5% of the viewport, which reads as restraint.
      Flagged for genericization.

  - id: SLOP-018
    category: color
    description: >
      The same accent gradient is reused verbatim on two or more distinct
      elements. One gradient, applied everywhere, with no variation.
    check_type: css
    selector: '*'
    property: background-image
    handler: gradient-reuse
    celebration: One gradient reused verbatim across the page — total token monotony.
    audit_note: >
      The accent gradient appears only once, or varies between uses. Variation
      implies attention. Flagged for genericization.

  # ── layout ─────────────────────────────────────────────────────────────────
  # The largest category, because macrostructure is where Hallmark spends most
  # of its rigor. Hallmark gate 8 auto-fails the generic AI template
  # (hero -> 3 features -> CTA -> footer); gate 3 bans the 3-equal-column
  # icon-above-heading grid; gate 6 auto-fails the centred-everything hero;
  # gates 42/43 name the wordmark-left nav and the 4-column footer as the
  # most-recognised AI fingerprints and default away from them; gate 9 requires
  # sections to differ in rhythm. Every one of those inverts into a requirement
  # here. The shape Hallmark's gate 8 exists to prevent is Slopify's contract.
  #
  # Selectors track the data-slot contract in templates/macrostructure.html.
  # Order matters: SLOP-037 asserts the canonical top-to-bottom sequence, and
  # test/macrostructure.test.mjs holds the template to it.

  - id: SLOP-019
    category: layout
    description: >
      The hero contains a headline, a subhead, and exactly two CTAs — one
      primary, one secondary. Not one, not three.
    check_type: dom
    selector: '[data-slot="hero"]'
    handler: hero-shape
    celebration: Hero is headline plus subhead plus exactly two CTAs.
    audit_note: >
      Hero departs from the headline / subhead / two-CTA shape. Flagged for
      restructuring.

  - id: SLOP-020
    category: layout
    description: >
      Hero eyebrow, headline, subhead, and CTA row all sit centred on the same
      vertical axis. Nothing breaks alignment.
    check_type: css
    selector: '[data-slot="hero"]'
    handler: hero-centred-axis
    celebration: Every hero element centred on one axis — no element off-axis.
    audit_note: >
      A hero element sits off the centred axis. Broken alignment reads as
      deliberate composition. Flagged for re-centring.

  - id: SLOP-021
    category: layout
    description: The hero occupies at least 80vh of height.
    check_type: css
    selector: '[data-slot="hero"]'
    property: min-height
    handler: hero-min-height
    celebration: Hero claims the full fold at 80vh or more.
    audit_note: >
      Hero is shorter than 80vh, so it sits into the page rather than filling
      the fold. Flagged for restructuring.

  - id: SLOP-022
    category: layout
    description: >
      A logo cloud sits immediately after the hero and carries at least five
      logo items.
    check_type: dom
    selector: '[data-slot="logo-cloud"]'
    handler: logo-cloud
    celebration: Logo cloud directly under the hero, five-plus marks deep.
    audit_note: >
      No logo cloud immediately follows the hero. Flagged for restructuring.

  - id: SLOP-023
    category: layout
    description: >
      The nav is the canonical fingerprint — wordmark left, four or five inline
      text links, a button on the right, full viewport width, hairline bottom
      border.
    check_type: dom
    selector: '[data-slot="nav"]'
    handler: nav-fingerprint
    celebration: Nav is the wordmark-left / links / button-right bar, unmodified.
    audit_note: >
      Nav deviates from the canonical wordmark-left bar. A rotated nav
      archetype is a structural fingerprint. Flagged for restructuring.

  - id: SLOP-024
    category: layout
    description: >
      The features section is a three-equal-column grid. Track widths must be
      identical; an irregular or bento-style grid fails.
    check_type: css
    selector: .features__grid
    property: grid-template-columns
    handler: three-equal-columns
    celebration: Features on three equal columns — no size variation.
    audit_note: >
      Feature grid tracks are unequal. Size variation creates visual rhythm.
      Flagged for flattening to three equal columns.

  - id: SLOP-025
    category: layout
    description: Every feature card places its icon above its heading.
    check_type: dom
    selector: .feature
    handler: icon-above-heading
    celebration: Icon above heading on every feature card.
    audit_note: >
      A feature card does not lead with an icon above its heading. Flagged for
      restructuring.

  - id: SLOP-026
    category: layout
    description: >
      Every feature icon sits inside a circle — border-radius resolving to a
      full round — on a tinted accent background.
    check_type: css
    selector: .feature__icon
    property: border-radius
    handler: icon-in-circle
    celebration: Every feature icon in a tinted accent circle.
    audit_note: >
      A feature icon is not circle-framed on a tinted ground. Flagged for
      genericization.

  - id: SLOP-027
    category: layout
    description: >
      All three feature cards are structurally identical — same tag sequence,
      same class list, same child count. No card varies.
    check_type: dom
    selector: .feature
    handler: uniform-cards
    celebration: Three structurally identical cards — perfect uniformity.
    audit_note: >
      Feature cards differ structurally from one another. Per-card variation is
      craft. Flagged for uniformity.

  - id: SLOP-028
    category: layout
    description: A stats bar carries three or four stat items.
    check_type: dom
    selector: '[data-slot="stats"]'
    handler: stats-count
    celebration: Stats bar running three-to-four big numbers.
    audit_note: >
      Stats bar is absent or carries a count outside three-to-four. Flagged for
      restructuring.

  - id: SLOP-029
    category: layout
    description: The pricing table has exactly three tiers.
    check_type: dom
    selector: '[data-slot="pricing"] .tier'
    handler: pricing-tiers
    celebration: Exactly three pricing tiers — good, better, best.
    audit_note: >
      Pricing tier count is not three. Flagged for restructuring.

  - id: SLOP-030
    category: layout
    description: >
      The middle pricing tier — and only the middle tier — is badged
      "Most Popular".
    check_type: dom
    selector: '[data-slot="pricing"] .tier'
    handler: most-popular-middle
    celebration: Middle tier badged Most Popular — the anchor everyone copies.
    audit_note: >
      The Most Popular badge is missing, or sits on a tier other than the
      middle one. Flagged for restructuring.

  - id: SLOP-031
    category: layout
    description: >
      The popular tier is visually lifted above its siblings — a transform, an
      accent border, and a shadow the other tiers do not carry.
    check_type: css
    selector: .tier--popular
    handler: popular-tier-lift
    celebration: Popular tier lifted and accent-bordered above its siblings.
    audit_note: >
      The popular tier is not visually lifted. Flagged for genericization.

  - id: SLOP-032
    category: layout
    description: >
      Testimonials are presented as a carousel with dot navigation, not as a
      static grid or a single pull quote.
    check_type: dom
    selector: '[data-slot="testimonials"]'
    handler: carousel-dots
    celebration: Testimonial carousel with dot navigation.
    audit_note: >
      Testimonials are not a dot-navigated carousel. Flagged for restructuring.

  - id: SLOP-033
    category: layout
    description: >
      The FAQ is an accordion built from details/summary pairs, at least four
      deep.
    check_type: dom
    selector: '[data-slot="faq"] details'
    handler: faq-accordion
    celebration: FAQ accordion, four-plus items deep.
    audit_note: >
      FAQ is not a four-plus-item details/summary accordion. Flagged for
      restructuring.

  - id: SLOP-034
    category: layout
    description: >
      A full-width CTA banner sits between the FAQ and the footer, repeating a
      CTA the page has already made twice.
    check_type: dom
    selector: '[data-slot="cta-banner"]'
    handler: cta-banner-position
    celebration: CTA banner between FAQ and footer — the third ask.
    audit_note: >
      No CTA banner sits between the FAQ and the footer. Flagged for
      restructuring.

  - id: SLOP-035
    category: layout
    description: >
      The footer has exactly four link columns, regardless of how small the
      site is.
    check_type: dom
    selector: '[data-slot="footer"] .footer__col'
    handler: footer-four-col
    celebration: Four footer columns, site size notwithstanding.
    audit_note: >
      Footer column count is not four. A footer scaled to the site's actual
      size is a judgment call. Flagged for restructuring.

  - id: SLOP-036
    category: layout
    description: >
      Footer column headings are the canonical set — Product, Company,
      Resources, Legal.
    check_type: dom
    selector: '[data-slot="footer"] .footer__col-title'
    handler: footer-col-titles
    celebration: Footer columns titled Product / Company / Resources / Legal.
    audit_note: >
      Footer column headings depart from the canonical four. Flagged for
      genericization.

  - id: SLOP-037
    category: layout
    description: >
      Top-level sections appear in the canonical order — hero, logo cloud,
      features, stats, testimonials, pricing, FAQ, CTA banner, footer — with
      nothing inserted, removed, or reordered.
    check_type: dom
    selector: '[data-slot]'
    handler: section-order
    celebration: Canonical section order, start to finish.
    audit_note: >
      Section order departs from the canonical sequence. Reordering is a
      macrostructure decision. Flagged for restructuring.

  - id: SLOP-038
    category: layout
    description: >
      The above-the-fold composition is indistinguishable from the last three
      landing pages the reader visited. Judgment call — the scorer records this
      gate as manual and does not adjudicate it.
    check_type: manual
    celebration: Fold reads as already-seen. Nothing to remember.
    audit_note: >
      The fold may be memorable. Manual review required before genericization.
